systemProp.file.encoding=UTF-8
android.useAndroidX=true

# Hardware-tuned for this workstation:
# Intel Core Ultra 9 275HX, 24 logical processors, ~32 GiB RAM, project on SSD-backed D:.
org.gradle.daemon=true
org.gradle.jvmargs=-Xms1g -Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Dconsole.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# The project has independent :common, :desktop, and :android task graphs; let Gradle
# schedule them concurrently and keep enough workers for Kotlin, Java, Android, and resource tasks.
org.gradle.parallel=true
org.gradle.workers.max=24
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin 2.x uses ABI snapshots internally; keep incremental compilation on and give
# the daemon enough room for Compose Desktop plus Android compilation without GC churn.
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# Verified for the latency-critical :desktop:shadowJarAll graph: the custom
# version guard and parallel packaging task are configuration-cache safe, and
# the cache removes repeated Kotlin DSL / Compose / AGP configuration overhead
# from warm packaging runs.
org.gradle.configuration-cache=true
