systemProp.file.encoding=UTF-8

# Keep the Gradle daemon hot and large enough for Compose/Kotlin/Shadow workloads.
# This workstation has 24 logical processors and about 32 GiB RAM; 8 GiB keeps
# heavy desktop builds away from GC pressure without starving the OS or IDE.
org.gradle.daemon=true
org.gradle.jvmargs=-Xms1g -Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Dconsole.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# Let Gradle actually use the CPU and SSD instead of serializing independent work.
org.gradle.parallel=true
org.gradle.workers.max=24
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin compilation should stay incremental and run in a long-lived daemon.
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC

# Verified for the latency-critical shadowJarAll graph: custom resource/version
# tasks are configuration-cache safe, and the cache removes repeated Kotlin DSL /
# Compose configuration overhead from warm packaging runs.
org.gradle.configuration-cache=true
