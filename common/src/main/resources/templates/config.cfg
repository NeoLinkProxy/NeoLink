# NeoLink desktop client configuration.
# 这里只放桌面 UI 会实际读取的配置，避免把 CLI/旧单隧道配置伪装成 GUI 默认值。

# NeoAuthServer / NAS 地址。
# 用于登录、注册、实名认证和拉取当前账号的密钥授权节点。
NAS_URL=https://neolink.ceroxe.top/

# NKM 当前可用节点列表。
# GUI 会将 NAS 授权节点与这里返回的在线节点取交集；请求成功后会缓存为 nodes.json。
# 如果 NKM 因限流或网络异常不可达，GUI 会回退到缓存 nodes.json 再与 NAS 授权节点取交集。
NKM_NODELIST_URL=https://p.ceroxe.top:49999/client/nodelist
